<title>LAVÉA Login</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f8f5f2;
        font-family: Arial, sans-serif;
    }

    .login-box {
        width: 350px;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    h1 {
        margin-bottom: 5px;
        color: #333;
    }

    p {
        color: #888;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        margin-top: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #222;
        color: white;
        cursor: pointer;
    }

    #loginMessage {
        margin-top: 15px;
        text-align: center;
    }
</style>
<div class="login-box">

    <h1>LAVÉA</h1>
    <p>Salon Dashboard</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Log in
        </button>

    </form>

    <div id="loginMessage"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="login.js"></script>
